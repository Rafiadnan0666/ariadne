<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: ws: wss:; frame-src 'self' https: http:; media-src 'self' https: http: blob:; object-src 'none'; base-uri 'self'; form-action 'self' https: http:"
    />
    <title>Ariadne Browser</title>
    <style>
      /* Global styles - the container for our browser UI */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background: #1e1e1e;
        color: #e0e0e0;
      }
      
      #root { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      
      /* Styles will be imported from CSS modules via Vite */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
